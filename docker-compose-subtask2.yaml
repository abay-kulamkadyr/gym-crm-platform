services:
  main:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym-crm
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - gym-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy

  report:
    build:
      context: https://github.com/abay-kulamkadyr/trainer-workload-service.git
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://root:secret@mongodb:27017/trainer_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8081:8081"
    networks:
      - gym-network
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy

  eureka:
    build:
      context: https://github.com/abay-kulamkadyr/eureka-server.git
    ports:
      - "8761:8761"
    networks:
      - gym-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 8761" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gym-crm
    ports:
      - "5432:5432"
    networks:
      - gym-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d gym-crm" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: 'mongo:8.2.5'
    environment:
      - 'MONGO_INITDB_DATABASE=trainer_db'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27017:27017'
    networks:
      - gym-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:8.0.0
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"  # JMX
      - "9099:9099"  # Controller
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9099"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9099
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - gym-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gym-network:
    driver: bridge
